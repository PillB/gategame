name: Gateflow quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gateflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static, simulation, Worker and Pages checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify executable script modes
        run: |
          for script in scripts/*.sh; do
            test -x "$script" || { echo "Missing executable Git file mode: $script"; exit 1; }
          done
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check the Pages gameplay/adapter
        run: npm run typecheck:pages
      - name: Simulation and Sites Worker rendering
        run: npm test
      - name: GitHub Pages build and artifact contract
        run: npm run test:pages
      - name: Upload inspectable compiled PR site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4/v6 pinned
        with:
          name: gateflow-pr-pages-${{ github.sha }}
          path: dist/pages/
          if-no-files-found: error
          retention-days: 7
      - name: Chrome browser gameplay and mobile smoke
        run: node scripts/browser-smoke.mjs
      - name: Per-tick Chrome screenshot and state parity audit (R04/R05/R06 + live edit)
        if: github.event_name == 'pull_request'
        run: node scripts/tick-visual-audit.mjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4/v6 pinned
        with:
          name: gateflow-browser-${{ github.sha }}
          path: evidence/browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload 0.1-second screenshot ledger
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4/v6 pinned
        with:
          name: gateflow-tick-audit-${{ github.sha }}
          path: evidence/tick-audit/**
          if-no-files-found: warn
          retention-days: 3
