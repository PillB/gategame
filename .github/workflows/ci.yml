name: Gateflow quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gateflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static, simulation, Worker and Pages checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check the Pages gameplay/adapter
        run: npm run typecheck:pages
      - name: Simulation and Sites Worker rendering
        run: npm test
      - name: GitHub Pages build and artifact contract
        run: npm run test:pages
