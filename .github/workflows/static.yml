# Gateflow Pages: never publish uncompiled source or an untested commit.
name: Deploy tested Gateflow to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateflow-pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify and package built game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify executable script modes
        run: |
          for script in scripts/*.sh; do
            test -x "$script" || { echo "Missing executable Git file mode: $script"; exit 1; }
          done
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Strict Pages typecheck
        run: npm run typecheck:pages
      - name: Simulation and Sites Worker regression
        run: npm test
      - name: Build and verify static Pages files and source revision
        run: npm run test:pages
      - name: Chrome browser gameplay and mobile smoke
        run: node scripts/browser-smoke.mjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4/v6 pinned
        with:
          name: gateflow-browser-${{ github.sha }}
          path: evidence/browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload compiled game only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/pages

  deploy:
    name: Publish verified game
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built game
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Check out source for external verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js for remote verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify live public GitHub Pages SHA and assets
        run: node scripts/verify-live-pages.mjs
